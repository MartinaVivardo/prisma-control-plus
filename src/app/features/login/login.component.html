<section class="login-page">
  <h2>Login – Empleados Prisma</h2>
 

  <form class="login-form" (ngSubmit)="iniciarSesion()">
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        type="text"
        [(ngModel)]="usuario"
        name="usuario"
        placeholder="empleado"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="prisma"
        required
      />
    </div>

    <button type="submit" [disabled]="!usuario || !password">
      Iniciar sesión
    </button>

    <button type="button" class="secondary" (click)="cerrarSesion()">
      Cerrar sesión
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

  </form>

  <a routerLink="/" class="back-link">← Volver al inicio</a>
</section>
